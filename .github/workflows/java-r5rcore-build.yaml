name: Java R5RCore build

on:
  push:
    paths:
      - java-r5rcore/**
      - .github/workflows/java-r5rcore-build.yaml

jobs:
  build:
    runs-on: ubuntu-latest
      
    steps:
      - uses: actions/checkout@v3
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages
        run: |
          install.packages(c('devtools', 'remotes'))
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}
        working-directory: r-package
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@ccb4328a959376b642e027874838f60f8e596de3
      - name: Build with Gradle
        uses: gradle/gradle-build-action@749f47bda3e44aa060e82d7b3ef7e40d953bd629
        with:
          arguments: build
          build-root-directory: java-r5rcore
      
      - name: Create pull request
        run: |
          git switch -c jar-update-${GITHUB_SHA}
          mv java-r5rcore/build/libs/java-r5rcore-*.jar r-package/inst/jar/r5r.jar
          git add r-package/inst/jar/r5r.jar
          git commit -m "Rebuild JAR for commit ${GITHUB_SHA}"
          gh pr create -a "${GITHUB_ACTOR}" -B "${GITHUB_REF}" -t "Update JAR for branch ${GITHUB_REF}" -b "Update JAR for branch ${GITHUB_REF}, commit ${GITHUB_SHA}"