name: Java R5RCore build

on:
  push:
    paths:
      - java-r5rcore/**
      - .github/workflows/java-r5rcore-build.yaml

jobs:
  build:
    env:
      GH_TOKEN: ${{ github.token }}

    runs-on: ubuntu-latest
      
    # don't build on merges to master
    if: ${{ !github.ref_protected }}

    steps:
      - uses: actions/checkout@v3
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
    
      - name: Install R packages
        run: |
          install.packages(c('devtools', 'remotes'))
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}
        working-directory: r-package
      
      - name: Install system dependencies
        run: |
          while read -r cmd
          do
            eval sudo $cmd
          done < <(Rscript -e 'writeLines(remotes::system_requirements("ubuntu", "20.04"))')
        working-directory: r-package

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@ccb4328a959376b642e027874838f60f8e596de3
      - name: Build with Gradle
        uses: gradle/gradle-build-action@749f47bda3e44aa060e82d7b3ef7e40d953bd629
        with:
          arguments: build
          build-root-directory: java-r5rcore
      
      # create a verified commit from GH actions
      # see https://gist.github.com/swinton/03e84635b45c78353b1f71e41007fc7c
      - name: Commit JAR
        run: |
          gh api --method PUT /repos/:owner/:repo/contents/r-package/inst/jar/r5r.jar \
            --field message="Update JAR for commit ${GITHUB_SHA}" \
            --field content=@<( base64 -i r-package/inst/jar/r5r.jar ) \
            --field encoding=base64 \
            --field branch=${GITHUB_REF} \
            --field sha=$(git rev-parse ${GITHUB_REF}:r-package/inst/jar/r5r.jar)


        
            
          